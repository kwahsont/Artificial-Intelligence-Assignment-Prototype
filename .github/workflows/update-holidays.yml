name: Update public holidays

# Pulls the latest Malaysian (Perak) public holidays into docs/data/public_holidays.js
# every Monday, so the dashboard picks up newly gazetted or moved holidays automatically.
on:
  schedule:
    - cron: "0 0 * * 1"   # Mondays 00:00 UTC (08:00 Malaysia time)
  workflow_dispatch:       # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade holidays
      - run: python src/update_holidays.py
      - name: Commit if the holiday list changed
        run: |
          if git diff --quiet -- docs/data/public_holidays.js; then
            echo "No holiday changes."
            exit 0
          fi
          # ignore a change that is only the "updated" timestamp
          if [ "$(git diff -U0 -- docs/data/public_holidays.js | grep -E '^[+-] ' | grep -vc '"updated"')" = "0" ]; then
            echo "Only the timestamp changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data/public_holidays.js
          git commit -m "Update Perak public holidays"
          git push
