# Publishes the dashboard (the docs/ folder) to GitHub Pages as a plain static site.
# No Jekyll: the files are served exactly as they are, so docs/index.html is the homepage.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  # commits made by the weekly holiday update don't trigger "push", so redeploy after it
  workflow_run:
    workflows: ["Update public holidays"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload the dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
